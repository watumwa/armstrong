<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armstrong | Waste Operations</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172d45;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:255px;background:#0b2847;color:white;padding:26px 15px;overflow:auto}aside h2{margin:0 8px;font-size:21px;letter-spacing:1px}aside small{display:block;color:#a5c1d8;margin:5px 8px 30px}aside button{display:block;width:100%;text-align:left;background:transparent;color:#b7ccdf;border:0;padding:13px 14px;border-radius:9px;margin:3px 0}aside button.active,aside button:hover{background:#174c74;color:white}main{margin-left:255px;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #e1e7ee;padding:19px 30px}header strong{font-size:15px}header span{color:#60748b;font-size:13px}.content{padding:30px;max-width:1500px;margin:auto}h1{font-size:27px;margin:0 0 7px}p{color:#65778b;margin:0 0 24px}.pill{font-size:11px;background:#e6f5ed;color:#19744a;padding:6px 10px;border-radius:20px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #e3eaf1;border-radius:15px;padding:20px;box-shadow:0 3px 12px #102b4410}.card label{font-size:13px;color:#697c90}.card strong{display:block;font-size:27px;margin:12px 0}.card small{color:#26895c}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel h3{margin:0 0 18px;font-size:17px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#708296;background:#f5f8fb;font-weight:600}td,th{padding:13px 11px;border-bottom:1px solid #edf1f5}td b{display:block}td small{color:#75879a}.status{border-radius:20px;padding:5px 9px;background:#e8f7ee;color:#15794c;font-size:12px}.status.unpaid{background:#fff1df;color:#a36a16}.toolbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:18px}.toolbar input,.form input,.form select{padding:11px 12px;border:1px solid #d9e2eb;border-radius:8px;min-width:0}.toolbar input{width:280px}.primary{background:#12694b;border:0;color:white;border-radius:9px;padding:11px 15px;font-weight:600}.secondary{border:1px solid #d8e2eb;background:white;border-radius:9px;padding:10px 14px;color:#244a68}.map{height:300px;border-radius:12px;background:radial-gradient(circle at 20% 40%,#b9d9d0 0 2%,transparent 2.5%),linear-gradient(135deg,#e0eae8 25%,#d2e1dc 25% 27%,#e7efec 27% 60%,#d2e1dc 60% 63%,#e0eae8 63%);position:relative;overflow:hidden}.pin{position:absolute;background:#0c704d;color:white;border:3px solid white;border-radius:50%;width:20px;height:20px;box-shadow:0 2px 6px #0003}.muted{font-size:12px;color:#7b8da0}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{display:grid;gap:6px;font-size:13px;color:#52677e}.form button{grid-column:1/-1}.mobile{display:none}.notice{background:#fff9e9;border:1px solid #f4e4b6;color:#856516;padding:12px 15px;border-radius:10px;font-size:12px;margin-bottom:16px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:700px){aside{position:static;width:100%;padding:15px}aside h2{font-size:17px}aside small{margin-bottom:10px}aside nav{display:flex;overflow:auto;gap:5px}aside button{white-space:nowrap;width:auto}main{margin-left:0}header{padding:14px}.content{padding:16px}.grid{gap:10px}.card{padding:14px}.card strong{font-size:21px}.toolbar{flex-wrap:wrap}.toolbar input{width:100%}.panel{padding:14px;overflow:auto}.form{grid-template-columns:1fr}table{min-width:540px}}
</style></head><body><aside><h2>♻ ARMSTRONG</h2><small>GLOBAL SOLUTIONS · Waste Management</small><nav id="nav"></nav></aside><main><header><strong>Armstrong Operations Center</strong><span>Frontend demonstration <span class="pill">DEMO MODE</span></span></header><div class="content"><div id="screen"></div></div></main><script>
const initial=[{id:"AGS-01421",name:"T-Care Medical Clinic",type:"Clinic",location:"Nsambya, Makindye",fee:40000,day:"Saturday",paid:true},{id:"AGS-01422",name:"Kibuli Community Hospital",type:"Hospital",location:"Kibuli, Kampala",fee:250000,day:"Monday",paid:true},{id:"AGS-01423",name:"Goodlife Pharmacy",type:"Pharmacy",location:"Kabalagala",fee:60000,day:"Wednesday",paid:false},{id:"AGS-01424",name:"St Luke Medical Centre",type:"Clinic",location:"Muyenga",fee:90000,day:"Friday",paid:false},{id:"AGS-01425",name:"Nakasero Diagnostic Lab",type:"Laboratory",location:"Nakasero",fee:130000,day:"Tuesday",paid:true}];
let clients=structuredClone(initial),events=[],page="Dashboard",query="";const pages=["Dashboard","Clients","Service Agreements","Waste Collections","Schedules & Routes","Client Map","Payments","QR Codes","Staff & Teams","Reports","Settings"];const ugx=n=>"UGX "+Number(n).toLocaleString("en-UG");const el=document.getElementById("screen");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function go(p){page=p;query="";render()}function header(title,description){return "<h1>"+title+"</h1><p>"+description+"</p><div class='notice'>Illustrative records only. No backend, verified QR scan, GPS validation, real invoices or payment processing is connected.</div>"}function card(label,value,foot){return "<div class='card'><label>"+label+"</label><strong>"+value+"</strong><small>"+foot+"</small></div>"}function row(c,action){return "<tr><td><b>"+esc(c.name)+"</b><small>"+esc(c.location)+"</small></td><td>"+esc(c.id)+"</td><td>"+esc(c.day)+"</td><td>"+ugx(c.fee)+"</td><td><span class='status "+(c.paid?"":"unpaid")+"'>"+(c.paid?"Paid":"Unpaid")+"</span></td><td><button class='secondary' data-action='"+action+"' data-id='"+esc(c.id)+"'>"+(action==="payment"?"Record payment":action==="collection"?"Collect":"View")+"</button></td></tr>"}function table(action){let data=clients.filter(c=>(c.name+" "+c.location+" "+c.id).toLowerCase().includes(query.toLowerCase()));return "<div class='panel'><div class='toolbar'><input id='search' placeholder='Search facilities...' value='"+esc(query)+"'><button class='primary' data-action='new'>+ Register facility</button></div><div style='overflow:auto'><table><thead><tr><th>Facility</th><th>Client ID</th><th>Collection day</th><th>Monthly fee</th><th>Payment</th><th>Action</th></tr></thead><tbody>"+data.map(c=>row(c,action)).join("")+"</tbody></table></div></div>"}function render(){document.getElementById("nav").innerHTML=pages.map(p=>"<button class='"+(p===page?"active":"")+"' data-page='"+p+"'>"+p+"</button>").join("");const paid=clients.filter(c=>c.paid);let s="";if(page==="Dashboard"){s=header("Operations overview","Track clients, waste collections, field staff and revenue.")+"<div class='grid'>"+card("Registered facilities",clients.length,"Active client directory")+card("Demo collections",events.filter(e=>e.type==="Collection").length,"Recorded this session")+card("Monthly paid accounts",paid.length,"Of "+clients.length+" facilities")+card("Unpaid monthly fees",ugx(clients.filter(c=>!c.paid).reduce((a,c)=>a+c.fee,0)),"Illustrative balances")+"</div><div class='layout'><div>"+table("collection")+"</div><div class='panel'><h3>Collection team</h3><p>David Kato · Waste collector</p><p>Peter Ssenyonjo · Waste collector</p><p>Sarah Namuli · Revenue collector</p><p>Grace Akello · Supervisor</p><button class='primary' data-page='Staff & Teams'>View staff</button></div></div>"}else if(page==="Clients"){s=header("Healthcare facilities","Client profiles, service schedules and monthly fees.")+table("view")}else if(page==="Client Map"){s=header("Facility locations","Schematic map preview. Real geolocation will require verified coordinates.")+"<div class='panel'><div class='map'>"+clients.map((c,i)=>"<span class='pin' title='"+esc(c.name)+"' style='left:"+(14+i*16)+"%;top:"+(25+(i%3)*21)+"%'></span>").join("")+"</div><p class='muted'>Markers are illustrative and must not be used for navigation.</p></div>"}else if(page==="Payments"){s=header("Payments & balances","Separate payment recording from waste collection.")+table("payment")}else if(page==="Waste Collections"){s=header("Waste collections","Field-service confirmation workflow.")+table("collection")}else if(page==="Staff & Teams"){s=header("Staff & teams","Roles and field assignments.")+"<div class='grid'>"+card("Waste collectors","2","Demonstration")+card("Revenue collectors","1","Demonstration")+card("Supervisors","1","Demonstration")+card("Total staff","4","Demonstration")+"</div><div class='panel'><h3>Staff directory</h3><p>David Kato — Waste Collector</p><p>Peter Ssenyonjo — Waste Collector</p><p>Sarah Namuli — Revenue Collector</p><p>Grace Akello — Supervisor</p></div>"}else if(page==="QR Codes"){s=header("Facility QR identities","Each registered facility will receive a secure unique QR code.")+table("view")+"<p class='muted'>A real QR must not encode sensitive client details; server-issued identifiers and staff authentication will be required.</p>"}else if(page==="Reports"){s=header("Operational reports","Summary of demonstration accounts and transactions.")+"<div class='grid'>"+card("Contracted monthly fees",ugx(clients.reduce((a,c)=>a+c.fee,0)),"Illustrative")+card("Paid accounts",paid.length,"Illustrative")+card("Unpaid accounts",clients.length-paid.length,"Illustrative")+card("Demo events",events.length,"This session")+"</div>"}else if(page==="Settings"){s=header("Company settings","Brand and operational configuration preview.")+"<div class='panel'><h3>Armstrong Global Solutions SMC Ltd</h3><p>Kibuli along Kakungulu Road, Kampala</p><p>Currency: UGX</p><p>Backend integration: not connected</p></div>"}else{s=header(page,"Frontend workflow preview for Armstrong operations.")+table("view")}el.innerHTML=s;bind()}function bind(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));let search=document.getElementById("search");if(search)search.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();let n=document.getElementById("search");n.focus();n.setSelectionRange(pos,pos)}}function action(a,id){if(a==="new"){el.innerHTML=header("Register facility","Demonstration-only registration form.")+"<div class='panel'><form class='form' id='facility'><label>Facility name<input name='name' required></label><label>Facility type<select name='type'><option>Clinic</option><option>Hospital</option><option>Pharmacy</option><option>Laboratory</option></select></label><label>Location<input name='location' required></label><label>Collection day<select name='day'>"+["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(x=>"<option>"+x+"</option>").join("")+"</select></label><label>Monthly fee (UGX)<input name='fee' type='number' min='0' required></label><button class='primary'>Save demo facility</button></form></div>";document.getElementById("facility").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));clients.push({...d,id:"AGS-"+String(1421+clients.length).padStart(5,"0"),fee:Number(d.fee),paid:false});go("Clients")};return}let c=clients.find(x=>x.id===id)||clients[0];if(a==="view"){el.innerHTML=header(esc(c.name),"Facility profile · "+esc(c.id))+"<div class='panel'><h3>"+esc(c.type)+"</h3><p>"+esc(c.location)+"</p><p>Collection day: "+esc(c.day)+"</p><p>Monthly service fee: "+ugx(c.fee)+"</p><p>Payment status: "+(c.paid?"Paid":"Unpaid")+"</p><button class='primary' id='back'>Back to clients</button></div>";document.getElementById("back").onclick=()=>go("Clients");return}el.innerHTML=header(a==="payment"?"Record payment":"Record waste collection",esc(c.name)+" · "+esc(c.id))+"<div class='panel'><form class='form' id='event'>"+(a==="payment"?"<label>Amount received (UGX)<input type='number' name='amount' min='1' value='"+c.fee+"' required></label><label>Payment method<select name='method'><option>Cash</option><option>Mobile Money</option><option>Bank transfer</option></select></label>":"<label>Waste type<select name='type'><option>Infectious waste</option><option>Sharps</option><option>General waste</option><option>Pharmaceutical waste</option></select></label><label>Quantity<input name='quantity' placeholder='e.g. 4 bags / 12 kg' required></label>")+"<button class='primary'>Confirm demo "+a+"</button></form></div>";document.getElementById("event").onsubmit=e=>{e.preventDefault();events.push({type:a==="payment"?"Payment":"Collection",client:c.id,data:Object.fromEntries(new FormData(e.target))});if(a==="payment")c.paid=true;go(a==="payment"?"Payments":"Waste Collections")}}render();
</script></body></html>
