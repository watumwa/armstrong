name: Fleet automatic alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-alert-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.repository == 'watumwa/armstrong'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Scan fleet alerts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.FLEET_DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.FLEET_DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "::error::Set FLEET_DATABASE_URL and FLEET_DJANGO_SECRET_KEY repository secrets."
            exit 1
          fi
          python manage.py scan_fleet_alerts
